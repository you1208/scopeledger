[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeledger"
version = "0.1.0"
description = "Run commands inside a declared scope and emit independently verifiable receipts."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yohei Watanabe"}]
keywords = ["ai-agents", "evidence", "governance", "receipts", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/you1208/scopeledger"
Documentation = "https://github.com/you1208/scopeledger#readme"
Issues = "https://github.com/you1208/scopeledger/issues"
Changelog = "https://github.com/you1208/scopeledger/blob/main/CHANGELOG.md"

[project.scripts]
scopeledger = "scopeledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
